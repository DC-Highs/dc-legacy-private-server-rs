[package]
name = "dragon-city"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Dragon City Legacy Server - local server for the original Adobe Flash game (2012-2020)"
authors = ["Gabriel18017", "Marcuth <me@marcuth.dev>"]
license = "MIT"
readme = "README.md"
default-run = "dragon-city"

[[bin]]
name = "dragon-city"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "query", "matched-path", "original-uri"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
http-body-util = "0.1"
futures-util = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "derive", "macros"] }
mongodb = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
email_address = "0.2"

dashmap = "6"
parking_lot = "0.12"
percent-encoding = "2"
form_urlencoded = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Password hashing is deliberately slow; keep it fast enough in debug builds (the test suite).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
